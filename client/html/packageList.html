<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Package List</title>
  <link rel="stylesheet" href="../css/packageList.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="../js/packageList.js" type="module"></script>
</head>
<body>
  <div class="container">
    <div id="toast" class="toast hidden"></div>

    <h1>Package List</h1>
    <button id="add-package-top" class="btn primary">Add Package</button>

    <div id="package-list" class="table-container">
      <table id="package-table">
        <thead>
          <tr>
            <th>Package ID</th>
            <th>Product SKU</th>
            <th>Product Name</th>
            <th>Customer</th>
            <th>Opened</th>
            <th>ETA</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="add-package-bottom" class="btn primary">Add Package</button>
    </div>

    <div id="customer-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="close-customer-modal">&times;</span>
        <h2>Customer Details</h2>
        <p><strong>Name:</strong> <span id="cust-name"></span></p>
        <p><strong>Email:</strong> <span id="cust-email"></span></p>
        <p><strong>Address:</strong></p>
        <ul id="cust-address"></ul>
      </div>
    </div>

    <!-- Location Add Modal -->
    <div id="location-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="close-location-modal">&times;</span>
        <h2>Add Location</h2>
        <form id="location-form">
          <div class="form-group">
            <label for="location-input">Location (e.g., Tel Aviv, Israel):</label>
            <input type="text" id="location-input" name="location" required />
            <div id="location-suggestion" class="suggestion hidden"></div>
          </div>
          <button type="submit" class="btn primary">Add</button>
        </form>
      </div>
    </div>

    <!-- Path View Modal -->
    <div id="path-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="close-path-modal">&times;</span>
        <h2>Package Path</h2>
        <div id="path-details"></div>
      </div>
    </div>

    <!-- Add New Package Modal -->
    <div id="add-package-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="close-add-modal">&times;</span>
        <h2>Add New Package</h2>
        <form id="package-form">
          <div class="form-group">
            <label for="prod_id">SKU</label>
            <input type="text" id="prod_id" name="prod_id" required />
          </div>
          <div class="form-group">
            <label for="name">Product Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-group">
            <label for="customer">Customer</label>
<select id="customer" name="customer_id" required>
              <option value="">Select customer...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="start_date">Start Date</label>
            <input type="date" id="start_date" name="start_date" required />
          </div>
          <div class="form-group">
            <label for="eta">Estimated Arrival</label>
            <input type="date" id="eta" name="eta" required />
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
              <option value="packed">Packed</option>
              <option value="shipped">Shipped</option>
              <option value="intransit">In Transit</option>
              <option value="delivered">Delivered</option>
            </select>
          </div>
          <button type="submit" class="btn primary">Submit</button>
        </form>
      </div>
    </div>

    <!-- Static Map Modal -->
<div id="map-modal" class="modal hidden">
  <div class="modal-content map-modal-content">
    <span class="close-btn" id="close-map-modal">&times;</span>
    <div class="modal-body">
      <div id="map-loader" class="spinner"></div>
      <img id="map-image" src="" alt="Map" style="display: none;" />
    </div>
  </div>
</div>
  </div>
</body>
</html>
